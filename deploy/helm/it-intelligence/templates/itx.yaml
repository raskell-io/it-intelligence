apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-itx, labels: {app.kubernetes.io/name: itx}}
spec:
  replicas: {{ .Values.itx.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: itx, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: itx, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      containers:
        - name: itx
          image: {{ .Values.image.itx }}
          args: ["serve"]
          env:
            - name: ITX_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: url}}
            - {name: ITX_SCHEDULES, value: {{ ternary "1" "0" .Values.itx.schedules | quote }}}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-itx}
spec:
  selector: {app.kubernetes.io/name: itx, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 8080, targetPort: http, name: http}]
