findings:
    - insight: unowned_production_app
      entities:
        - ctx:Application/solvency-calc
      note: EA record has no owner; it can only be derived from the namespace
    - insight: ghost_application
      entities:
        - ctx:Application/market-insight
      note: EA says production; no repository, workload or incident anywhere
    - insight: retired_but_running
      entities:
        - ctx:Application/quote-classic
      note: EA says retired; a workload still runs in policy-prod
    - insight: exposed_without_waf
      entities:
        - ctx:Endpoint/brokers.kestrel.example/
      note: internet endpoint without a WAF policy
    - insight: duplicate_capability_support
      entities:
        - ctx:Capability/payment-processing
        - ctx:MarketUnit/central
        - ctx:Application/payment-gateway
        - ctx:Application/payhub
      note: two platforms for payment processing in Kestrel Central
    - insight: duplicate_capability_support
      entities:
        - ctx:Capability/underwriting
        - ctx:MarketUnit/central
        - ctx:Application/quote-classic
        - ctx:Application/rating-engine
      note: the retired engine still counts until it is switched off
    - insight: truck_factor_one
      entities:
        - ctx:Repository/kestrel/rating-engine
      note: one committer in twelve months behind a production application
    - insight: truck_factor_one
      entities:
        - ctx:Repository/kestrel/doc-archive
      note: one committer in twelve months behind a production application
    - insight: conflicting_realisation
      entities:
        - ctx:Repository/kestrel/report-templates
      note: two applications claim the same repository
    - insight: not_in_ea
      entities:
        - ctx:Application/south-integration-hub
      note: an integration platform group IT does not know about
    - insight: namespace_without_owner
      entities:
        - ctx:Namespace/batch-legacy
      note: no owner label and nothing that could tell
