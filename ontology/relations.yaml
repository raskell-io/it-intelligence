# Relation kinds: a closed vocabulary. In the ontology a relationship is a slot; in the store every
# relationship is a row of its own (table edge) with a basis, a confidence, a source and evidence.
#
# LinkML allows one domain per slot, so the full domain and range live in annotations that the
# vocabulary generator (ontology/gen/vocabulary.py) reads:
#   ctx_domain    entity kinds an edge may start from ("Entity" means any)
#   ctx_range     entity kinds an edge may point to
#   ctx_cardinality  one | many, per source entity, among active edges
id: https://example.org/it-intelligence/relations
name: relations
default_prefix: ctx
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  ctx: https://example.org/it-intelligence/
imports:
  - linkml:types

slots:
  realised_by:
    description: The application is implemented in this repository.
    domain: Application
    range: Repository
    multivalued: true
    annotations: {ctx_domain: Application, ctx_range: Repository, ctx_cardinality: many}
  deployed_as:
    description: The application runs as this workload.
    domain: Application
    range: Workload
    multivalued: true
    annotations: {ctx_domain: Application, ctx_range: Workload, ctx_cardinality: many}
  runs_in:
    description: The workload runs in this namespace.
    domain: Workload
    range: Namespace
    annotations: {ctx_domain: Workload, ctx_range: Namespace, ctx_cardinality: one}
  built_from:
    description: The workload's image is built from this repository.
    domain: Workload
    range: Repository
    annotations: {ctx_domain: Workload, ctx_range: Repository, ctx_cardinality: one}
  owned_by:
    description: The accountable team.
    range: Team
    annotations: {ctx_domain: "Application Repository Workload Namespace Endpoint", ctx_range: Team, ctx_cardinality: one}
  part_of:
    description: The team belongs to this market unit.
    domain: Team
    range: MarketUnit
    annotations: {ctx_domain: Team, ctx_range: MarketUnit, ctx_cardinality: one}
  operated_by:
    description: The application is operated by, and serves, this market unit.
    domain: Application
    range: MarketUnit
    multivalued: true
    annotations: {ctx_domain: Application, ctx_range: MarketUnit, ctx_cardinality: many}
  supports:
    description: The application supports this business capability.
    domain: Application
    range: Capability
    multivalued: true
    annotations: {ctx_domain: Application, ctx_range: Capability, ctx_cardinality: many}
  refines:
    description: The capability is a part of this broader capability.
    domain: Capability
    range: Capability
    annotations: {ctx_domain: Capability, ctx_range: Capability, ctx_cardinality: one}
  exposed_via:
    description: The application is reachable through this endpoint.
    domain: Application
    range: Endpoint
    multivalued: true
    annotations: {ctx_domain: Application, ctx_range: Endpoint, ctx_cardinality: many}
  routes_to:
    description: The endpoint sends traffic to this workload.
    domain: Endpoint
    range: Workload
    multivalued: true
    annotations: {ctx_domain: Endpoint, ctx_range: Workload, ctx_cardinality: many}
  depends_on:
    description: The application calls, or needs, this other application.
    domain: Application
    range: Application
    multivalued: true
    annotations: {ctx_domain: Application, ctx_range: Application, ctx_cardinality: many}
  constrains:
    description: The decision applies to this entity.
    domain: Decision
    range: Entity
    multivalued: true
    annotations: {ctx_domain: Decision, ctx_range: Entity, ctx_cardinality: many}
  supersedes:
    description: The decision replaces this earlier decision.
    domain: Decision
    range: Decision
    annotations: {ctx_domain: Decision, ctx_range: Decision, ctx_cardinality: one}
  replaced_by:
    description: The application is, or will be, replaced by this successor.
    domain: Application
    range: Application
    annotations: {ctx_domain: Application, ctx_range: Application, ctx_cardinality: one}
